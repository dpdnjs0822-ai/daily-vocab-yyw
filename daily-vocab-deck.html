<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 단어장 · Daily Vocab Deck</title>
<style>
  @font-face { font-family: 'fallback-serif'; src: local('Georgia'); }
  :root{
    --bg: #1B2430;
    --bg-soft: #232E3D;
    --paper: #FFFDF6;
    --paper-line: #E7E0CC;
    --ink: #1B2430;
    --ink-soft: #5B6472;
    --accent: #E8B73D;
    --accent-soft: #6E5A22;
    --ring: #0F151D;
    --biz: #C97B4A;
    --dine: #B5563F;
    --daily: #4C7A5E;
    --travel: #3D6FA8;
    --social: #8C5BA6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #25324480 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #2c3a4f80 0%, transparent 55%),
      var(--bg);
    color: var(--paper);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 28px 16px 60px;
  }
  .wrap{ max-width: 720px; margin: 0 auto; }

  header{ margin-bottom: 22px; }
  .eyebrow{
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  .credit{
    font-family: 'Courier New', monospace;
    font-size: 11.5px;
    letter-spacing: .04em;
    color: #C9D2DC;
    margin: -2px 0 14px;
    text-shadow: 0 1px 8px rgba(0,0,0,.3);
  }
  .credit::before{ content: "✦  "; color: var(--accent); }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(28px, 6vw, 38px);
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -.01em;
    color: #FFFFFF;
    text-shadow: 0 2px 14px rgba(0,0,0,.35);
  }
  .sub{
    color: #E4E9EF;
    font-size: 14.5px;
    line-height: 1.6;
    margin: 0;
    max-width: 50ch;
    text-shadow: 0 1px 10px rgba(0,0,0,.3);
  }

  /* Tabs styled like index card tabs */
  .tabs{
    display:flex;
    gap: 6px;
    margin: 26px 0 14px;
    overflow-x:auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex: 0 0 auto;
    padding: 9px 16px 8px;
    border-radius: 9px 9px 0 0;
    border: none;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .03em;
    color: #B7C0CC;
    background: var(--bg-soft);
    transition: all .18s ease;
    white-space: nowrap;
  }
  .tab[data-cat="business"].active{ background: var(--paper); color: var(--biz); }
  .tab[data-cat="dining"].active{ background: var(--paper); color: var(--dine); }
  .tab[data-cat="daily"].active{ background: var(--paper); color: var(--daily); }
  .tab[data-cat="travel"].active{ background: var(--paper); color: var(--travel); }
  .tab[data-cat="social"].active{ background: var(--paper); color: var(--social); }
  .tab:not(.active):hover{ color: var(--paper); }

  .deck-panel{
    background: var(--paper);
    border-radius: 4px 14px 14px 14px;
    padding: 20px 18px 24px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.6);
  }
  .deck-bar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 16px;
    color: var(--ink);
  }
  .deck-bar .count{
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .shuffle-btn{
    display:flex; align-items:center; gap:7px;
    border: 1.5px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .12s ease, background .12s ease;
  }
  .shuffle-btn:hover{ background: #34404f; }
  .shuffle-btn:active{ transform: scale(.96); }
  .shuffle-btn svg{ width:14px; height:14px; }

  .cards{
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .card{
    position: relative;
    border: 1px solid var(--paper-line);
    border-left: 5px solid var(--cat-color, var(--accent));
    border-radius: 8px;
    padding: 14px 16px;
    cursor: pointer;
    background:
      repeating-linear-gradient(
        var(--paper) 0px, var(--paper) 27px, #EFE9D6 28px
      );
    transition: box-shadow .15s ease;
  }
  .card:hover{ box-shadow: 0 6px 18px -10px rgba(0,0,0,.35); }

  .card-top{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .word-en{
    font-family: Georgia, serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
  }
  .word-row{
    display:flex;
    align-items:center;
    gap: 7px;
  }
  .speak-btn{
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--paper-line);
    background: #F4EFE0;
    color: var(--cat-color, var(--accent-soft));
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    transition: background .15s ease, transform .12s ease;
  }
  .speak-btn:hover{ background: #ECE4CB; }
  .speak-btn:active{ transform: scale(.9); }
  .speak-btn.playing{ background: var(--cat-color, var(--accent)); color: #FFFDF6; }
  .speak-btn svg{ width: 13px; height: 13px; }
  .pos{
    font-family:'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .word-ko{
    font-size: 15px;
    color: var(--cat-color, var(--accent-soft));
    font-weight: 600;
  }

  .reveal{
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height .28s ease, opacity .22s ease, margin-top .28s ease;
  }
  .card.open .reveal{
    max-height: 140px;
    opacity: 1;
    margin-top: 10px;
  }
  .example{
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink);
    border-top: 1px dashed var(--paper-line);
    padding-top: 9px;
  }
  .example .en{ font-style: italic; }
  .example .ko{ color: var(--ink-soft); margin-top: 2px; }

  .hint{
    text-align:center;
    margin-top: 16px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  footer{
    text-align:center;
    color: #6B7686;
    font-size: 12px;
    margin-top: 26px;
  }

  @media (max-width: 480px){
    .word-en{ font-size: 17px; }
    .deck-panel{ padding: 16px 12px 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Daily Vocab Deck</p>
    <p class="credit">made by Yewon</p>
    <h1>오늘의 단어장</h1>
    <p class="sub">상황을 고르고 카드를 섞으면, 그 상황에서 자주 쓰는 영어 단어 10개가 무작위로 뽑혀요. 카드를 탭하면 뜻과 예문이 펼쳐집니다.</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="deck-panel">
    <div class="deck-bar">
      <span class="count" id="count">10 words</span>
      <button class="shuffle-btn" id="shuffleBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        다시 섞기
      </button>
    </div>
    <div class="cards" id="cards"></div>
    <p class="hint">카드를 탭해서 뜻 / 예문 보기</p>
  </div>

  <footer>매일 새로 섞어서, 상황별 핵심 단어를 익혀보세요.</footer>
</div>

<script>

const order = ["business","dining","daily","travel","social"];
let current = "business";
let activeWords = [];

function pickRandom(arr, n){
  const copy = [...arr];
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, n);
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = order.map(key => {
    const cat = DATA[key];
    return `<button class="tab${key===current?' active':''}" data-cat="${key}">${cat.label}</button>`;
  }).join('');
  tabsEl.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      current = btn.dataset.cat;
      shuffle();
      renderTabs();
    });
  });
}

function renderCards(){
  const cardsEl = document.getElementById('cards');
  const color = DATA[current].color;
  cardsEl.innerHTML = activeWords.map((item, i) => `
    <div class="card" style="--cat-color:${color}" data-i="${i}">
      <div class="card-top">
        <span class="word-row">
          <span class="word-en">${item.w}</span>
          <button class="speak-btn" data-word="${item.w.replace(/"/g,'&quot;')}" aria-label="발음 듣기" title="발음 듣기 (미국식)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 12c0-1.77-.77-3.29-2-4.31v8.62c1.23-1.02 2-2.54 2-4.31z"/><path d="M14.5 4.97v2.06c2.89 1.05 5 3.81 5 7.07s-2.11 6.02-5 7.07v2.06c4.01-1.09 7-4.74 7-9.13s-2.99-8.04-7-9.13z"/></svg>
          </button>
        </span>
        <span class="pos">${item.pos}</span>
      </div>
      <div class="word-ko">${item.ko}</div>
      <div class="reveal">
        <div class="example">
          <div class="en">"${item.ex}"</div>
          <div class="ko">${item.exko}</div>
        </div>
      </div>
    </div>
  `).join('');
  cardsEl.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => card.classList.toggle('open'));
  });
  cardsEl.querySelectorAll('.speak-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      speakWord(btn.dataset.word, btn);
    });
  });
  document.getElementById('count').textContent = `${activeWords.length} words · ${DATA[current].label}`;
}

let usVoice = null;
function pickUSVoice(){
  const voices = window.speechSynthesis.getVoices();
  usVoice = voices.find(v => v.lang === 'en-US' && /female|samantha|zira|ava/i.test(v.name))
    || voices.find(v => v.lang === 'en-US')
    || voices.find(v => v.lang && v.lang.startsWith('en'))
    || null;
}
if ('speechSynthesis' in window) {
  pickUSVoice();
  window.speechSynthesis.onvoiceschanged = pickUSVoice;
}

function speakWord(text, btn){
  if (!('speechSynthesis' in window)) {
    alert('이 브라우저는 음성 재생을 지원하지 않아요.');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  if (usVoice) utter.voice = usVoice;
  utter.rate = 0.92;
  if (btn) {
    btn.classList.add('playing');
    utter.onend = () => btn.classList.remove('playing');
    utter.onerror = () => btn.classList.remove('playing');
  }
  window.speechSynthesis.speak(utter);
}

function shuffle(){
  activeWords = pickRandom(DATA[current].words, 10);
  renderCards();
}

document.getElementById('shuffleBtn').addEventListener('click', shuffle);

renderTabs();
shuffle();
</script>
